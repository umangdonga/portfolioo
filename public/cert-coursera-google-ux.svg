<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Background Guilloche Pattern -->
    <pattern id="guillochePattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M0,50 Q25,25 50,50 T100,50" fill="none" stroke="#f0efe8" stroke-width="1" />
      <path d="M0,25 Q25,50 50,25 T100,25" fill="none" stroke="#f5f4ed" stroke-width="0.8" />
      <path d="M0,75 Q25,100 50,75 T100,75" fill="none" stroke="#f5f4ed" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Certificate Canvas -->
  <rect width="1000" height="700" fill="#ffffff" />
  <rect width="1000" height="700" fill="url(#guillochePattern)" opacity="0.6" />

  <!-- Double Border Frame -->
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#6b7280" stroke-width="3" />
  <rect x="28" y="28" width="944" height="644" fill="none" stroke="#9ca3af" stroke-width="1" />
  <!-- Corner Ornaments -->
  <rect x="20" y="20" width="14" height="14" fill="#6b7280" />
  <rect x="966" y="20" width="14" height="14" fill="#6b7280" />
  <rect x="20" y="666" width="14" height="14" fill="#6b7280" />
  <rect x="966" y="666" width="14" height="14" fill="#6b7280" />

  <!-- Right Side Coursera Grey Ribbon Banner -->
  <g id="courseraRibbon">
    <path d="M660,28 L890,28 L890,540 L775,605 L660,540 Z" fill="#e5e9ef" />
    <path d="M660,28 L890,28 L890,540 L775,605 L660,540 Z" fill="none" stroke="#d1d5db" stroke-width="1.5" />
    
    <text x="775" y="145" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#111827" text-anchor="middle" letter-spacing="2">COURSE</text>
    <text x="775" y="175" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="#111827" text-anchor="middle" letter-spacing="2">CERTIFICATE</text>

    <!-- Coursera Seal Badge -->
    <g transform="translate(775, 430)">
      <!-- Outer Dotted Circle -->
      <circle r="88" fill="#ffffff" stroke="#374151" stroke-width="3.5" />
      <circle r="82" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="3,3" />
      <circle r="68" fill="none" stroke="#374151" stroke-width="1.5" />

      <!-- Text in Ring -->
      <path id="upperSealPath" d="M-60,0 A60,60 0 0,1 60,0" fill="none" />
      <text font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#374151" letter-spacing="2">
        <textPath href="#upperSealPath" startOffset="50%" text-anchor="middle">· EDUCATION FOR EVERYONE ·</textPath>
      </text>

      <path id="lowerSealPath" d="M-60,0 A60,60 0 0,0 60,0" fill="none" />
      <text font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#374151" letter-spacing="3">
        <textPath href="#lowerSealPath" startOffset="50%" text-anchor="middle">COURSE CERTIFICATE</textPath>
      </text>

      <!-- Coursera Logo inside seal -->
      <text x="0" y="8" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#111827" text-anchor="middle" letter-spacing="-0.5">coursera</text>
    </g>
  </g>

  <!-- Left Main Content Area -->
  <!-- Google Multi-Color Logo -->
  <g transform="translate(95, 110)">
    <text font-family="'Product Sans', 'Inter', sans-serif" font-size="64" font-weight="700">
      <tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan>
    </text>
  </g>

  <!-- Issue Date -->
  <text x="95" y="240" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#4b5563">Sep 1, 2026</text>

  <!-- Recipient Name -->
  <text x="95" y="295" font-family="'Georgia', serif" font-size="34" font-weight="400" fill="#1f2937" letter-spacing="1">Donga Umang Hasmukhbhai</text>

  <!-- Statement -->
  <text x="95" y="340" font-family="'Inter', sans-serif" font-size="13" fill="#6b7280">has successfully completed</text>

  <!-- Course Title -->
  <text x="95" y="388" font-family="'Georgia', serif" font-size="24" font-weight="600" fill="#111827">Foundations of User Experience (UX) Design</text>

  <!-- Authorized By -->
  <text x="95" y="425" font-family="'Inter', sans-serif" font-size="13" fill="#4b5563">an online course authorized by Google and offered through Coursera</text>

  <!-- Signature Area -->
  <g transform="translate(95, 525)">
    <!-- Stylized Amanda Brophy Signature -->
    <path d="M0,25 C15,5 30,10 40,25 C50,30 65,8 85,25 C100,10 120,20 145,22 C160,24 175,18 190,25" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />
    <path d="M20,15 C45,35 60,5 95,20 C120,35 150,15 180,28" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="42" x2="250" y2="42" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2,2" />

    <text x="0" y="58" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#374151">Amanda Brophy</text>
    <text x="0" y="72" font-family="'Inter', sans-serif" font-size="10" fill="#6b7280">Global Director of Google Career Certificates</text>
  </g>

  <!-- Verification Link & Coursera Footer -->
  <g transform="translate(700, 605)">
    <text x="240" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4b5563" text-anchor="end">Verify at:</text>
    <text x="240" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#2563eb" text-anchor="end">https://coursera.org/verify/P8W73ZVAB5GK</text>
    <text x="240" y="38" font-family="'Inter', sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Coursera has confirmed the identity of this individual and their participation in the course.</text>
  </g>

  <!-- Bottom Legal Disclaimer -->
  <text x="500" y="660" font-family="'Inter', sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">
    This certificate attests to the learner's completion of an online course / project delivered via Coursera. It does not constitute formal enrollment at any university or entity and does not itself grant academic credit, grades, or a degree.
  </text>
</svg>
